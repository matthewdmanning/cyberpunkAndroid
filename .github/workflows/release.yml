name: Release Workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-release:
    name: Build & Publish Release AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Full Test Suite
        run: ./gradlew test --stacktrace

      - name: Build Release Library AAR
        run: ./gradlew :cyberpunkandroid:assembleRelease --stacktrace

      - name: Upload Release AAR
        uses: actions/upload-artifact@v4
        with:
          name: cyberpunkandroid-release-aar
          path: cyberpunkandroid/build/outputs/aar/
