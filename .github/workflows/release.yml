name: Release & Publish Workflow

on:
  push:
    branches:
      - main

jobs:
  publish-release:
    name: Build, Tag & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Full Test Suite
        run: ./gradlew test --stacktrace

      - name: Build Release Library AAR
        run: ./gradlew :cyberpunkandroid:assembleRelease --stacktrace

      - name: Bump Version and Push Tag
        id: tag_version
        run: |
          if ! LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            NEW_TAG="v1.0.0"
          else
            if [[ $LATEST_TAG =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              NEW_PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            else
              echo "Error: Latest tag $LATEST_TAG does not match vX.Y.Z format"
              exit 1
            fi
          fi
          
          echo "Creating new tag: $NEW_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_version.outputs.tag }}
          name: Release ${{ steps.tag_version.outputs.tag }}
          files: cyberpunkandroid/build/outputs/aar/cyberpunkandroid-release.aar
          generate_release_notes: true
